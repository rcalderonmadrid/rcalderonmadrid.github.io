<!-- Share buttons: shown automatically at the end of every news item (pages inside /news/) -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!/\/news\/[^/]+\.html$/.test(window.location.pathname)) return;
  var main = document.querySelector("main.content");
  if (!main) return;
  var url = encodeURIComponent(window.location.href);
  var titleEl = document.querySelector("h1.title");
  var title = encodeURIComponent(titleEl ? titleEl.textContent.trim() : document.title);
  var links = [
    ["X", "bi-twitter-x", "https://twitter.com/intent/tweet?text=" + title + "&url=" + url],
    ["Bluesky", "bi-bluesky-custom", "https://bsky.app/intent/compose?text=" + title + "%20" + url],
    ["LinkedIn", "bi-linkedin", "https://www.linkedin.com/sharing/share-offsite/?url=" + url],
    ["WhatsApp", "bi-whatsapp", "https://wa.me/?text=" + title + "%20" + url],
    ["Email", "bi-envelope", "mailto:?subject=" + title + "&body=" + url]
  ];
  var bar = document.createElement("div");
  bar.className = "share-bar";
  var html = '<span class="share-label">Share</span>';
  links.forEach(function (l) {
    var target = l[0] === "Email" ? "" : ' target="_blank" rel="noopener"';
    html += '<a class="share-btn" href="' + l[2] + '"' + target + ' title="Share on ' + l[0] + '" aria-label="Share on ' + l[0] + '"><i class="bi ' + l[1] + '"></i></a>';
  });
  html += '<button class="share-btn" type="button" data-copy title="Copy link" aria-label="Copy link"><i class="bi bi-link-45deg"></i></button>';
  if (navigator.share) {
    html += '<button class="share-btn" type="button" data-native title="More options (Instagram, Telegram...)" aria-label="More sharing options"><i class="bi bi-share"></i></button>';
  }
  html += '<span class="share-msg" aria-live="polite"></span>';
  bar.innerHTML = html;
  main.appendChild(bar);
  var msg = bar.querySelector(".share-msg");
  bar.querySelector("[data-copy]").addEventListener("click", function () {
    navigator.clipboard.writeText(window.location.href).then(function () {
      msg.textContent = "Link copied!";
      setTimeout(function () { msg.textContent = ""; }, 2000);
    });
  });
  var nat = bar.querySelector("[data-native]");
  if (nat) nat.addEventListener("click", function () {
    navigator.share({ title: decodeURIComponent(title), url: window.location.href }).catch(function () {});
  });
});
</script>
